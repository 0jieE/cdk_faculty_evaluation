{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Faculty evaluation{% endblock %} | Colegio de Kidapawan</title>
  <link rel="icon" href="{% static 'img/cdk_logo.jpg' %}">
  <link rel="preload" href="{% static 'fonts/atkinson-hyperlegible-latin-400-normal.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'vendor/htmx.min.js' %}" defer></script>
  <script src="{% static 'js/app.js' %}" defer></script>
  <meta name="htmx-config" content='{"scrollIntoViewOnBoost": false, "defaultFocusScroll": true}'>
</head>
<body hx-boost="true">
{% block body %}{% endblock %}
</body>
</html>
